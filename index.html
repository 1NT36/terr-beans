<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ledger · Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0d0f0e;
      color: #f0ede8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .gate-box {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .gate-logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #00c853;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
    }
    .gate-logo span { color: #7a8580; font-weight: 400; }
    .gate-sub {
      font-size: 12px;
      color: #7a8580;
      margin-bottom: 40px;
      letter-spacing: 0.06em;
    }
    .gate-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7a8580;
      margin-bottom: 8px;
      text-align: left;
    }
    .gate-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .gate-input {
      flex: 1;
      background: #141817;
      border: 1px solid #2e3431;
      color: #f0ede8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      letter-spacing: 0.06em;
    }
    .gate-input:focus { border-color: #00832e; }
    .gate-input.shake {
      animation: shake 0.35s ease;
      border-color: #ff3b30 !important;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .gate-error {
      font-size: 12px;
      color: #ff3b30;
      height: 16px;
      margin-bottom: 6px;
    }
    .btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.65; }
    .btn-primary { background: #00c853; color: #000; }
    .btn-full { width: 100%; padding: 13px; font-size: 14px; font-weight: 600; }
    #loading { margin-top: 20px; color: #7a8580; font-size: 13px; display: none; }
  </style>
</head>
<body>
  <div class="gate-box">
    <div class="gate-logo">LEDGER<span>.db</span></div>
    <div class="gate-sub">RESTRICTED ACCESS</div>
    <div class="gate-label">Access Key</div>
    <div class="gate-input-row">
      <input class="gate-input" type="password" id="gateInput" placeholder="Enter access key…" autocomplete="off" />
    </div>
    <div class="gate-error" id="gateError"></div>
    <button class="btn btn-primary btn-full" id="gateBtn">Enter</button>
    <div id="loading">Loading ledger…</div>
  </div>

  <script>
    const input = document.getElementById('gateInput');
    const btn = document.getElementById('gateBtn');
    const err = document.getElementById('gateError');
    const loading = document.getElementById('loading');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') submitGate(); });

    async function submitGate() {
      const key = input.value.trim();
      if (!key) return;
      btn.disabled = true;
      btn.textContent = 'Checking…';
      err.textContent = '';
      loading.style.display = 'block';

      try {
        const res = await fetch('/api/auth/access', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        if (!res.ok) throw new Error('Invalid access key');

        // Fetch the full app HTML
        const appRes = await fetch('/api/app', {
          headers: { 'X-Access-Key': key }
        });
        if (!appRes.ok) throw new Error('Failed to load application');

        const html = await appRes.text();
        document.documentElement.innerHTML = html;
        // The app script will run immediately after parsing

      } catch (e) {
        err.textContent = 'Incorrect access key.';
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 400);
        loading.style.display = 'none';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enter';
      }
    }
  </script>
</body>
</html>
